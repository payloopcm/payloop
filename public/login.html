<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="login.meta_title">Connexion - PayLoop</title>
    <link rel="icon" type="image/png" href="/images/icon-favicon-192.png">
    <link rel="apple-touch-icon" href="/images/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="stylesheet" href="/fonts/plus-jakarta-sans/plus-jakarta-sans.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, .font-sans { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Bouton FR/EN : la langue active est en blanc avec une ombre légère, l'autre reste grisée. */
        .lang-btn { color: #9ca3af; transition: color .15s; }
        .lang-btn.lang-active { background: #fff; color: #111827; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
        .lang-btn:not(.lang-active):hover { color: #4b5563; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="fixed top-4 right-4 inline-flex items-center bg-gray-100 border border-gray-200 rounded-full p-1 text-xs font-medium">
        <button id="lang-btn-fr" onclick="setLang('fr')" class="lang-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full">
            <svg width="16" height="16" viewBox="0 0 20 20" class="rounded-sm"><rect width="20" height="20" fill="#fff"/><rect width="6.67" height="20" fill="#002654"/><rect x="13.33" width="6.67" height="20" fill="#ED2939"/></svg>
            <span>FR</span>
        </button>
        <button id="lang-btn-en" onclick="setLang('en')" class="lang-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full">
            <svg width="16" height="16" viewBox="0 0 20 20" class="rounded-sm"><rect width="20" height="20" fill="#012169"/><path d="M0,0 L20,20 M20,0 L0,20" stroke="#fff" stroke-width="4"/><path d="M0,0 L20,20 M20,0 L0,20" stroke="#C8102E" stroke-width="2"/><path d="M10,0 V20 M0,10 H20" stroke="#fff" stroke-width="6"/><path d="M10,0 V20 M0,10 H20" stroke="#C8102E" stroke-width="3.6"/></svg>
            <span>EN</span>
        </button>
    </div>
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Logo -->
            <div class="text-center">
                <img src="/images/icon-favicon-192.png" alt="PayLoop" class="mx-auto h-12 w-auto mb-4 filter brightness-0">
                <h1 class="text-3xl font-bold text-gray-900">PayLoop</h1>
                <p class="mt-2 text-sm text-gray-600" data-i18n="login.subtitle">Connectez-vous à votre compte</p>
            </div>

            <!-- Tabs -->
            <div class="flex border-b border-gray-200">
                <button id="loginTab" onclick="showLogin()" class="flex-1 py-2 px-4 text-center border-b-2 border-green-600 text-green-600 font-medium" data-i18n="login.tab_login">
                    Connexion
                </button>
                <button id="registerTab" onclick="showRegister()" class="flex-1 py-2 px-4 text-center border-b-2 border-transparent text-gray-500 hover:text-gray-700" data-i18n="login.tab_register">
                    Inscription
                </button>
            </div>

            <!-- Login Form -->
            <div id="loginFormContainer" class="bg-white py-8 px-6 shadow rounded-lg">
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="loginEmail" class="block text-sm font-medium text-gray-700" data-i18n="login.email_label">Email</label>
                        <input id="loginEmail" type="email" required 
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500"
                               placeholder="ibrahim@payloop.cm" />
                    </div>

                    <div>
                        <label for="loginPassword" class="block text-sm font-medium text-gray-700" data-i18n="login.password_label">Mot de passe</label>
                        <input id="loginPassword" type="password" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" />
                    </div>

                    <div id="loginError" class="hidden text-red-600 text-sm"></div>
                    <div id="loginSuccess" class="hidden text-green-600 text-sm"></div>

                    <button type="submit" id="loginButton"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none" data-i18n="login.submit">
                        Se connecter
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="registerFormContainer" class="hidden bg-white py-8 px-6 shadow rounded-lg">
                <form id="registerForm" class="space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="registerFirstName" class="block text-sm font-medium text-gray-700" data-i18n="register.firstname_label">Prénom</label>
                            <input id="registerFirstName" type="text" required
                                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" />
                        </div>
                        <div>
                            <label for="registerLastName" class="block text-sm font-medium text-gray-700" data-i18n="register.lastname_label">Nom</label>
                            <input id="registerLastName" type="text" required
                                   class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" />
                        </div>
                    </div>

                    <div>
                        <label for="registerEmail" class="block text-sm font-medium text-gray-700" data-i18n="login.email_label">Email</label>
                        <input id="registerEmail" type="email" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" />
                    </div>

                    <div>
                        <label for="registerPassword" class="block text-sm font-medium text-gray-700" data-i18n="login.password_label">Mot de passe</label>
                        <input id="registerPassword" type="password" required minlength="6"
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-green-500 focus:border-green-500" />
                        <p class="mt-1 text-xs text-gray-500" data-i18n="register.password_hint">Minimum 6 caractères</p>
                    </div>

                    <div id="registerError" class="hidden text-red-600 text-sm"></div>
                    <div id="registerSuccess" class="hidden text-green-600 text-sm"></div>

                    <button type="submit" id="registerButton"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none" data-i18n="register.submit">
                        S'inscrire
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Traduction FR/EN : le dictionnaire de textes (i18n-login.js) doit être chargé avant le
         moteur qui les applique (i18n.js). -->
    <script src="/i18n-login.js"></script>
    <script src="/i18n.js"></script>

    <script>
        const API_URL = 'https://payloop-api-production.up.railway.app/api';

        // Switch tabs
        function showLogin() {
            document.getElementById('loginFormContainer').classList.remove('hidden');
            document.getElementById('registerFormContainer').classList.add('hidden');
            document.getElementById('loginTab').classList.add('border-green-600', 'text-green-600');
            document.getElementById('loginTab').classList.remove('border-transparent', 'text-gray-500');
            document.getElementById('registerTab').classList.remove('border-green-600', 'text-green-600');
            document.getElementById('registerTab').classList.add('border-transparent', 'text-gray-500');
        }

        function showRegister() {
            document.getElementById('loginFormContainer').classList.add('hidden');
            document.getElementById('registerFormContainer').classList.remove('hidden');
            document.getElementById('registerTab').classList.add('border-green-600', 'text-green-600');
            document.getElementById('registerTab').classList.remove('border-transparent', 'text-gray-500');
            document.getElementById('loginTab').classList.remove('border-green-600', 'text-green-600');
            document.getElementById('loginTab').classList.add('border-transparent', 'text-gray-500');
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');
            const successDiv = document.getElementById('loginSuccess');
            const button = document.getElementById('loginButton');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            button.textContent = payloopT('login.submit_loading');
            button.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || payloopT('login.error_default'));
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                successDiv.textContent = payloopT('login.success');
                successDiv.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                button.textContent = payloopT('login.submit');
                button.disabled = false;
            }
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const firstName = document.getElementById('registerFirstName').value;
            const lastName = document.getElementById('registerLastName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const errorDiv = document.getElementById('registerError');
            const successDiv = document.getElementById('registerSuccess');
            const button = document.getElementById('registerButton');

            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            button.textContent = payloopT('register.submit_loading');
            button.disabled = true;

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, first_name: firstName, last_name: lastName })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || payloopT('register.error_default'));
                }

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                successDiv.textContent = payloopT('register.success');
                successDiv.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                button.textContent = payloopT('register.submit');
                button.disabled = false;
            }
        });

        // Étape 1 du mode hors-ligne : enregistre le Service Worker qui met l'appli en cache
        // pour qu'elle puisse s'afficher même sans connexion.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js').catch((err) => {
                    console.error('Échec de l\'enregistrement du Service Worker :', err);
                });
            });
        }
    </script>
</body>
</html>
